<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Asset Intelligence</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M9 21l5-10 4 7 2-4 3 7z' fill='%2360a5fa'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
        if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
        document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="booting">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="#1e293b"/><path d="M9 21l5-10 4 7 2-4 3 7z" fill="#60a5fa"/></svg></span>
                <span class="brand-text">Asset Intelligence<small>Administration</small></span>
            </a>
            <div class="top-actions">
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch colour theme">
                    <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
                    <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <div class="user-box">
                    <a class="top-link" href="/">Back to app</a>
                    <button id="logoutBtn" class="top-link" type="button">Sign out</button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="results-head">
            <div><span class="eyebrow">Administration</span><h1>Customers and usage</h1></div>
            <div class="head-actions"><button id="addUserBtn" class="btn btn-primary">Add customer</button></div>
        </div>

        <div class="kpis" id="kpis"></div>

        <div class="workspace-head"><h2>Customers</h2></div>
        <div class="table-wrap">
            <table class="table" id="usersTable">
                <thead><tr><th>Customer</th><th>Role</th><th>Status</th><th>This month</th><th>Total</th><th>Last sign-in</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="workspace-head" style="margin-top:36px"><h2>Recent activity</h2></div>
        <div class="table-wrap">
            <table class="table" id="activityTable">
                <thead><tr><th>When</th><th>Customer</th><th>Brand</th><th>Source</th><th>Products</th><th>Images found</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <footer class="footer"><div class="footer-inner"><span>&copy; <span id="year">2026</span> Asset Intelligence. All rights reserved.</span></div></footer>

    <dialog id="userDialog" class="dialog">
        <form method="dialog" id="userForm" novalidate>
            <h2 id="dialogTitle">Add customer</h2>
            <label class="field"><span>Email</span><input id="fEmail" type="email" required></label>
            <div class="two"><label class="field"><span>Name</span><input id="fName" type="text"></label>
            <label class="field"><span>Company</span><input id="fCompany" type="text"></label></div>
            <div class="two"><label class="field"><span>Monthly product limit</span><input id="fLimit" type="number" min="0" placeholder="Leave blank for unlimited"></label>
            <label class="field"><span>Role</span><select id="fRole"><option value="user">Customer</option><option value="admin">Administrator</option></select></label></div>
            <label class="field"><span id="pwLabel">Password</span><input id="fPassword" type="text" autocomplete="off" placeholder="At least 8 characters"></label>
            <label class="check hidden" id="activeRow"><input id="fActive" type="checkbox"> Account active</label>
            <div id="dialogError" class="form-error hidden" role="alert"></div>
            <div class="dialog-actions">
                <button type="button" class="btn btn-ghost" id="cancelDialog">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveUser">Save</button>
            </div>
        </form>
    </dialog>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script src="/admin.js"></script>
</body>
</html>
